name: CI

# What has to hold before anything reaches main.
#
# The order is deliberate: the checks run cheapest first, so a broken build
# is reported by the thing that explains it rather than by the four minutes
# of compilation that happened to notice. Nothing here needs a secret — the
# app builds with the defaults in lib/site.ts — so it runs on forks too.

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the run before it pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The maths the editor rests on: timeline, geometry, loudness, stored
      # edits, cursor placement and the share endpoint's limits. Under a
      # second, so it goes first.
      - name: Tests
        run: bun test

      - name: Types
        run: bun run typecheck

      # The Worker is its own project with its own tsconfig, and the root one
      # excludes it — without this it would never be checked at all.
      - name: Types (worker)
        run: bun run typecheck:worker

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  # The exporter, driven in a browser that's already on the runner. Its own
  # job because it needs a server and a couple of minutes, and because when
  # it breaks it should be obvious that it was the export rather than a type.
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Serve
        run: bun run start &

      - name: Wait for the server
        run: |
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/record && exit 0
            sleep 1
          done
          echo "the server never came up"; exit 1

      - name: Export
        env:
          KIRMIZI_URL: http://localhost:3000
          KIRMIZI_BROWSER: chrome
        run: bun run test:browser
